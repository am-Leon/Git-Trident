name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run all tests
        run: bash tests/run_all.sh

  build-and-release:
    name: Build & Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build tarball
        run: bash build.sh

      - name: Verify version consistency
        run: |
          CONST_VER=$(grep 'TRIDENT_VERSION=' lib/git-trident-constants.sh | cut -d'"' -f2)
          TAG_VER="${{ steps.version.outputs.VERSION }}"
          if [[ "$CONST_VER" != "$TAG_VER" ]]; then
            echo "::error::Version mismatch! Tag=$TAG_VER Constants=$CONST_VER"
            echo "Run: ./scripts/bump-version.sh $TAG_VER"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/git-trident.tar.gz
          generate_release_notes: true
          name: "Git Trident v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Installation

            ```bash
            curl -fsSL https://raw.githubusercontent.com/am-Leon/Git-Trident/main/install.sh | bash
            ```

            Or download `git-trident.tar.gz` from the assets below and install manually.
